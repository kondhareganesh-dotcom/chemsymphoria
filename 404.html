<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | ChemSymphoria 2026–27</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <style>
    .error-page {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
      background: var(--color-void);
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '404';
      position: absolute;
      font-family: var(--font-display);
      font-size: 30vw;
      font-weight: 700;
      color: rgba(10,191,191,0.03);
      user-select: none;
      pointer-events: none;
      line-height: 1;
    }
    .error-content {
      position: relative;
      max-width: 480px;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-teal);
      margin-bottom: var(--space-6);
    }
    .error-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-4);
    }
    .error-desc {
      font-size: var(--text-base);
      color: var(--color-text-secondary);
      line-height: 1.7;
      margin-bottom: var(--space-8);
    }
    .error-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-molecule {
      width: 120px;
      height: 120px;
      margin: 0 auto var(--space-8);
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <svg class="error-molecule" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="60" cy="60" r="58" stroke="#0ABFBF" stroke-width="1.5" stroke-dasharray="8 4"/>
        <circle cx="60" cy="28" r="6" fill="#0ABFBF"/>
        <circle cx="88" cy="44" r="6" fill="#F5A623"/>
        <circle cx="88" cy="76" r="6" fill="#0ABFBF"/>
        <circle cx="60" cy="92" r="6" fill="#8B5CF6"/>
        <circle cx="32" cy="76" r="6" fill="#F5A623"/>
        <circle cx="32" cy="44" r="6" fill="#0ABFBF"/>
        <line x1="60" y1="28" x2="88" y2="44" stroke="#0ABFBF" stroke-width="1.5"/>
        <line x1="88" y1="44" x2="88" y2="76" stroke="#0ABFBF" stroke-width="1.5"/>
        <line x1="88" y1="76" x2="60" y2="92" stroke="#0ABFBF" stroke-width="1.5"/>
        <line x1="60" y1="92" x2="32" y2="76" stroke="#0ABFBF" stroke-width="1.5"/>
        <line x1="32" y1="76" x2="32" y2="44" stroke="#0ABFBF" stroke-width="1.5"/>
        <line x1="32" y1="44" x2="60" y2="28" stroke="#0ABFBF" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="8" fill="#8B5CF6" opacity="0.5"/>
        <circle cx="60" cy="60" r="3" fill="#8B5CF6"/>
      </svg>

      <p class="error-code">Error 404 · Bond not found</p>
      <h1 class="error-title">Molecule Missing</h1>
      <p class="error-desc">
        The page you're looking for seems to have undergone a phase transition to a different state. Let's navigate you back to familiar territory.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn btn--primary">← Back to Home</a>
        <a href="schedule.html" class="btn btn--ghost">View Schedule</a>
      </div>
    </div>
  </div>
</body>
</html>
