<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0A0E1A"/>
  <!-- Molecular benzene-ring-like hexagon -->
  <g stroke="#0ABFBF" stroke-width="2" stroke-linecap="round">
    <!-- Hexagon bonds -->
    <line x1="32" y1="12" x2="48" y2="21"/>
    <line x1="48" y1="21" x2="48" y2="39"/>
    <line x1="48" y1="39" x2="32" y2="48"/>
    <line x1="32" y1="48" x2="16" y2="39"/>
    <line x1="16" y1="39" x2="16" y2="21"/>
    <line x1="16" y1="21" x2="32" y2="12"/>
    <!-- Inner ring -->
    <line x1="32" y1="19" x2="41" y2="24"/>
    <line x1="41" y1="24" x2="41" y2="34"/>
    <line x1="41" y1="34" x2="32" y2="39"/>
    <line x1="32" y1="39" x2="23" y2="34"/>
    <line x1="23" y1="34" x2="23" y2="24"/>
    <line x1="23" y1="24" x2="32" y2="19"/>
  </g>
  <!-- Atom nodes -->
  <circle cx="32" cy="12" r="3" fill="#0ABFBF"/>
  <circle cx="48" cy="21" r="3" fill="#0ABFBF"/>
  <circle cx="48" cy="39" r="3" fill="#F5A623"/>
  <circle cx="32" cy="48" r="3" fill="#0ABFBF"/>
  <circle cx="16" cy="39" r="3" fill="#F5A623"/>
  <circle cx="16" cy="21" r="3" fill="#0ABFBF"/>
  <!-- Center atom -->
  <circle cx="32" cy="30" r="4" fill="#8B5CF6"/>
</svg>
